# cayi-ai.top -> AIEnglish. Existing public port 8443 and certificate retained.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name cayi-ai.top www.cayi-ai.top _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }
    location / { return 308 https://cayi-ai.top:8443$request_uri; }
}

server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    server_name cayi-ai.top www.cayi-ai.top _;
    ssl_certificate /etc/nginx/ssl/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/cayi-ai.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    client_max_body_size 16m;
    if ($host = www.cayi-ai.top) { return 308 https://cayi-ai.top:8443$request_uri; }
    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
